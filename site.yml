---
- name: Configure personal workstation
  hosts: localhost
  gather_facts: true
  roles:
      # - role: terminal   # ghostty for everything (editor's text-file open depends on this)
      #   tags: terminal
      - role: nodejs # Node.js via nvm (Neovim/Mason tooling; editor depends on it)
        tags: [nodejs, editor]
      - role: editor # neovim from source + personal config
        tags: editor
      - role: system # plain text console, no display manager (startx + dwm)
        tags: [system, wm]
      - role: dwm # tiling window manager (personal fork)
        tags: [dwm, wm]
      - role: st # terminal (personal fork)
        tags: [st, wm]
      - role: dmenu # launcher (personal fork)
        tags: [dmenu, wm]
      - role: slstatus # status bar (personal fork)
        tags: [slstatus, wm]
      - role: xsecurelock # screen locker (personal fork)
        tags: [xsecurelock, wm]
      - role: saver_blur # xsecurelock blurred saver (own repo, own binary)
        tags: [saver_blur, wm]
      - role: desktop # X session glue: .xinitrc, dotfiles, scripts, fonts
        tags: [desktop, wm]
      # - role: <next>
      #   tags: <next>
