---
# AppRole auth + address come from the environment (ANSIBLE_HASHI_VAULT_*),
# populated by scripts/bootstrap-secrets-env.sh into the gitignored .env.
- name: Ensure the ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Fetch the GitHub SSH key from OpenBao
  ansible.builtin.set_fact:
    secrets_github_private_key: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', secrets_ssh_key_path,
                engine_mount_point=secrets_kv_mount)['secret'][secrets_ssh_key_field] }}
  no_log: true

- name: Install the GitHub SSH private key
  ansible.builtin.copy:
    content: "{{ secrets_github_private_key }}"
    dest: "{{ secrets_ssh_key_dest }}"
    mode: "0600"
  no_log: true
