---
# The vault lookup runs on the controller in Ansible's own interpreter, so hvac
# must live there (not on the target). uv handles the install even for a pip-less
# uv venv, which the stdlib pip module can't.
- name: Ensure hvac is available to the controller Ansible (vault lookup)
  ansible.builtin.command:
    cmd: uv pip install --python "{{ ansible_playbook_python }}" hvac
  delegate_to: localhost
  run_once: true
  become: false
  register: secrets_hvac
  changed_when: "'Installed' in secrets_hvac.stdout or 'Prepared' in secrets_hvac.stdout"

# AppRole auth + address come from the environment (ANSIBLE_HASHI_VAULT_*),
# loaded by `source scripts/load-creds.sh`.
- name: Ensure the ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: Fetch the GitHub SSH key from OpenBao
  ansible.builtin.set_fact:
    secrets_github_private_key: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', secrets_ssh_key_path,
                engine_mount_point=secrets_kv_mount)['secret'][secrets_ssh_key_field] }}
  no_log: true

- name: Install the GitHub SSH private key
  ansible.builtin.copy:
    content: "{{ secrets_github_private_key }}"
    dest: "{{ secrets_ssh_key_dest }}"
    mode: "0600"
  no_log: true

# Without this the first git@github.com clone fails host-key verification on a
# fresh target. ssh-keyscan runs on the controller; the key is the same globally.
- name: Trust the github.com host key
  ansible.builtin.known_hosts:
    path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
    name: github.com
    key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 github.com') }}"
    state: present
