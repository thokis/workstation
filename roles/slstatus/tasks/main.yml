---
- name: Install build dependencies
  ansible.builtin.apt:
    name: "{{ slstatus_build_packages }}"
    state: present
  become: true

- name: Clone or update slstatus (upstream)
  ansible.builtin.git:
    repo: "{{ slstatus_repo }}"
    dest: "{{ slstatus_src }}"
    version: "{{ slstatus_version }}"
    force: true   # config.h is templated below; discard any local/fork drift
  register: slstatus_git

- name: Detect the battery device
  ansible.builtin.shell:
    cmd: set -o pipefail; ls /sys/class/power_supply/ 2>/dev/null | grep -m1 '^BAT' || true
    executable: /bin/bash
  register: slstatus_bat_detect
  changed_when: false

- name: Resolve the battery device (override wins, else detected)
  ansible.builtin.set_fact:
    slstatus_battery: "{{ slstatus_battery | default(slstatus_bat_detect.stdout | trim) }}"

- name: Deploy the templated config.h
  ansible.builtin.template:
    src: config.h.j2
    dest: "{{ slstatus_src }}/config.h"
    mode: "0644"
  register: slstatus_config

- name: Check whether slstatus is installed
  ansible.builtin.stat:
    path: "{{ slstatus_bin }}"
  register: slstatus_binary

- name: Build slstatus
  community.general.make:
    chdir: "{{ slstatus_src }}"
    target: all
  when: slstatus_config.changed or slstatus_git.changed or not slstatus_binary.stat.exists

- name: Install slstatus
  community.general.make:
    chdir: "{{ slstatus_src }}"
    target: install
  become: true
  when: slstatus_config.changed or slstatus_git.changed or not slstatus_binary.stat.exists
