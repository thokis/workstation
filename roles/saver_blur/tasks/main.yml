---
- name: Install build dependencies
  ansible.builtin.apt:
    name: "{{ saver_blur_build_packages }}"
    state: present
  become: true

- name: Clone or update the xsecurelock-saver-blur repo
  ansible.builtin.git:
    repo: "{{ saver_blur_repo }}"
    dest: "{{ saver_blur_src }}"
    version: "{{ saver_blur_version }}"
  register: saver_blur_git

- name: Check whether saver_blur is installed
  ansible.builtin.stat:
    path: "{{ saver_blur_bin }}"
  register: saver_blur_binary

- name: Build saver_blur
  community.general.make:
    chdir: "{{ saver_blur_src }}"
  when: saver_blur_git.changed or not saver_blur_binary.stat.exists

- name: Install saver_blur
  community.general.make:
    chdir: "{{ saver_blur_src }}"
    target: install
  when: saver_blur_git.changed or not saver_blur_binary.stat.exists
