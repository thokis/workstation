---
# The built-in modesetting driver (in xserver-xorg-core + glamor) drives AMD
# (amdgpu) and Intel (i915) — and NVIDIA via nouveau — so no per-vendor
# xserver-xorg-video-* package is needed.
xorg_packages:
  - xserver-xorg
  - xinit

# Opt-in extras for the exceptions: a specific vendor DDX or the proprietary
# NVIDIA driver (e.g. ["nvidia-driver-550"]). Empty = modesetting only.
xorg_extra_packages: []
