---
- name: Detect the active GPU kernel driver
  ansible.builtin.shell: |
    set -o pipefail
    for c in /sys/class/drm/card[0-9]; do
      if [ -e "$c/device/driver" ]; then
        basename "$(readlink -f "$c/device/driver")"
        break
      fi
    done
  args:
    executable: /bin/bash
  register: xorg_gpu_driver
  changed_when: false

- name: Report the detected GPU driver
  ansible.builtin.debug:
    msg: >-
      GPU driver: {{ xorg_gpu_driver.stdout | default('unknown') | trim }} —
      the modesetting driver handles amdgpu/i915 (and nvidia via nouveau).
      For the proprietary NVIDIA driver or a vendor DDX, set xorg_extra_packages.

- name: Install Xorg and xinit
  ansible.builtin.apt:
    name: "{{ xorg_packages + xorg_extra_packages }}"
    state: present
  become: true
