---
- name: Ensure ghostty is installed
  ansible.builtin.command: "command -v {{ item }}"
  changed_when: false
  loop: "{{ terminal_required_bins }}"

# Keystone: glib/GNOME launches this for Ctrl+Alt+T and every Terminal=true app
# (e.g. nvim opening a text file). Without it they fall back to gnome-terminal.
- name: Shim xdg-terminal-exec to ghostty
  ansible.builtin.file:
    src: "{{ terminal_ghostty_bin }}"
    dest: "{{ ansible_env.HOME }}/.local/bin/xdg-terminal-exec"
    state: link
    force: true

- name: Pin x-terminal-emulator alternative to ghostty
  community.general.alternatives:
    name: x-terminal-emulator
    path: "{{ terminal_ghostty_bin }}"
  become: true

- name: Install packages
  ansible.builtin.apt:
    name: "{{ terminal_install_packages }}"
    state: present
  become: true

- name: Remove gnome-terminal and xterm
  ansible.builtin.apt:
    name: "{{ terminal_remove_packages }}"
    state: absent
    purge: true
  become: true

- name: Set default terminal handlers in mimeapps.list
  community.general.ini_file:
    path: "{{ ansible_env.HOME }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item.mime }}"
    value: "{{ item.app }}"
    no_extra_spaces: true
    create: true
    mode: "0644"
  loop: "{{ terminal_default_apps }}"

- name: Register custom keybinding list
  community.general.dconf:
    key: "{{ terminal_keybinding_base }}"
    value: >-
      {{ terminal_keybindings | map(attribute='id')
         | map('regex_replace', '^(.+)$', terminal_keybinding_base ~ '/\g<1>/')
         | list }}

- name: Set custom keybinding names
  community.general.dconf:
    key: "{{ terminal_keybinding_base }}/{{ item.id }}/name"
    value: "'{{ item.name }}'"
  loop: "{{ terminal_keybindings }}"

- name: Set custom keybinding commands
  community.general.dconf:
    key: "{{ terminal_keybinding_base }}/{{ item.id }}/command"
    value: "'{{ item.command }}'"
  loop: "{{ terminal_keybindings }}"

- name: Set custom keybinding bindings
  community.general.dconf:
    key: "{{ terminal_keybinding_base }}/{{ item.id }}/binding"
    value: "'{{ item.binding }}'"
  loop: "{{ terminal_keybindings }}"
