---
- name: Install build dependencies
  ansible.builtin.apt:
    name: "{{ xsecurelock_build_packages }}"
    state: present
  become: true

- name: Clone or update the xsecurelock fork
  ansible.builtin.git:
    repo: "{{ xsecurelock_repo }}"
    dest: "{{ xsecurelock_src }}"
    version: "{{ xsecurelock_version }}"
  register: xsecurelock_git

- name: Generate the configure script
  ansible.builtin.command:
    cmd: sh autogen.sh
    chdir: "{{ xsecurelock_src }}"
    creates: "{{ xsecurelock_src }}/configure"

- name: Configure the build
  ansible.builtin.command:
    cmd: "./configure --with-pam-service-name={{ xsecurelock_pam_service }}"
    chdir: "{{ xsecurelock_src }}"
    creates: "{{ xsecurelock_src }}/Makefile"

- name: Check whether xsecurelock is installed
  ansible.builtin.stat:
    path: "{{ xsecurelock_bin }}"
  register: xsecurelock_binary

- name: Build xsecurelock
  community.general.make:
    chdir: "{{ xsecurelock_src }}"
  when: xsecurelock_git.changed or not xsecurelock_binary.stat.exists

- name: Install xsecurelock
  community.general.make:
    chdir: "{{ xsecurelock_src }}"
    target: install
  become: true
  when: xsecurelock_git.changed or not xsecurelock_binary.stat.exists
