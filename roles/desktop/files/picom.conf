#################################
# Backend
#################################
backend = "glx";
vsync = true;

#################################
# Blur (behind translucent windows)
#################################
blur-method = "dual_kawase";
blur-strength = 12;
blur-background = true;
blur-background-frame = true;

blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@"
];

#################################
# General
#################################
# Let st's own ARGB alpha do the transparency — do NOT set opacity rules
# for st, or the text goes translucent too.
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
